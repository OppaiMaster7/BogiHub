name: Game report
description: Tell us how a game works with BogiHub (works or not, both help)
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game and launcher
      placeholder: "Fortnite, Epic Games Launcher"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Works, Works with problems, Doesn't work]
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: Output mode
      options: [Xbox controller, Keyboard & mouse, Hybrid]
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Wireless puck, USB-C cable, Bluetooth]
    validations:
      required: true
  - type: dropdown
    id: steam
    attributes:
      label: Was Steam running?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything odd? Rumble, triggers, paddles, anti-cheat messages...
