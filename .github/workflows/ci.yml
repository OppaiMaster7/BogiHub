name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch native dependencies (SDL3, checksum-verified)
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-deps.ps1
      - name: Unit tests
        run: dotnet test tests/BogiHub.Core.Tests -c Release
      - name: Build app
        run: dotnet build src/BogiHub.App -c Release
